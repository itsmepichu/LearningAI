name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The Python labs' solutions are checked on a local Python. Without NumPy those tests skip.
      - run: python3 -m pip install numpy
      - run: npm run test:unit
      - run: npm run build
